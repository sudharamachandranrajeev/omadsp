# omadsp spike host — throwaway, runtime only.
#
# Minimal filter-hosting PipeWire client, same shape as
# $OMARCHY_PATH/default/audio/filter-chain-host.conf. Everything this process
# creates disappears when it exits. (context.objects in a client process are
# local and never exported, so the private test sink is created on the server by
# common.sh sink_start instead.)

context.properties = {
    log.level = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt args = { } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
#@MODULES@
]

