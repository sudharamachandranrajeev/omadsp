[workspace]
resolver = "3"
members = ["crates/omadsp-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
omadsp-core = { path = "crates/omadsp-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
debug = "line-tables-only"
