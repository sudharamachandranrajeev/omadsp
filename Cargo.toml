[workspace]
resolver = "3"
members = ["crates/omadsp-core", "crates/omadspd", "crates/omadsp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
omadsp-core = { path = "crates/omadsp-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }

[profile.release]
debug = "line-tables-only"
